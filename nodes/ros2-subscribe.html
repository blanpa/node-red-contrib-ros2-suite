<script type="text/javascript">
RED.nodes.registerType('ros2-subscribe', {
    category: 'ROS 2',
    color: '#4b8bbe',
    defaults: {
        name: { value: '' },
        connection: { value: '', type: 'ros2-connection' },
        topic: { value: '', required: true },
        rosType: { value: '' },
        throttle: { value: 0, validate: RED.validators.number(true) },
        queue: { value: 1, validate: RED.validators.number(true) }
    },
    inputs: 0,
    outputs: 1,
    icon: 'feed.svg',
    paletteLabel: 'subscribe',
    label: function () {
        return this.name || this.topic || 'ros2 subscribe';
    },
    labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
    },
    outputLabels: ['message'],
    oneditprepare: function () {
        var $type = $('#node-input-rosType');
        var $hint = $('#ros2-subscribe-hint');
        ROS2Suite.attachAutocomplete($('#node-input-topic'), 'topics', ROS2Suite.connId,
            ROS2Suite.typeDetector($type, $hint, 'topic'), $hint);
    }
});
</script>

<script type="text/html" data-template-name="ros2-subscribe">
    <div class="form-row">
        <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
        <input type="text" id="node-input-connection">
    </div>
    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-rss"></i> Topic</label>
        <input type="text" id="node-input-topic" placeholder="/turtle1/pose" autocomplete="off">
        <span id="ros2-subscribe-hint" class="ros2-hint"></span>
    </div>
    <div class="form-row">
        <label for="node-input-rosType"><i class="fa fa-cube"></i> Type</label>
        <input type="text" id="node-input-rosType" placeholder="auto-detect">
    </div>
    <div class="form-row">
        <label for="node-input-throttle"><i class="fa fa-tachometer"></i> Throttle</label>
        <input type="text" id="node-input-throttle" style="width: 70px"> ms between messages (0 = every message)
    </div>
    <div class="form-row">
        <label for="node-input-queue"><i class="fa fa-list"></i> Queue</label>
        <input type="text" id="node-input-queue" style="width: 70px"> messages kept while throttling
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/html" data-help-name="ros2-subscribe">
    <p>Receives messages from a ROS 2 topic through rosbridge.</p>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>the ROS message as JSON, e.g. <code>{x, y, theta, …}</code> for <code>turtlesim/msg/Pose</code>.</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd>the ROS topic name.</dd>
        <dt>ros <span class="property-type">object</span></dt>
        <dd><code>{topic, type, receivedAt}</code> — <code>receivedAt</code> is a millisecond timestamp.</dd>
    </dl>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Topic</dt>
        <dd>click into the field to pick from the topics the robot currently advertises.</dd>
        <dt>Type <span class="property-type">optional</span></dt>
        <dd>leave empty to detect it via rosapi. If set and the topic is advertised with a different
            type, the node reports the mismatch instead of subscribing.</dd>
        <dt>Throttle / Queue</dt>
        <dd>passed to rosbridge (<code>throttle_rate</code>, <code>queue_length</code>) — rosbridge drops
            messages before they cross the network, which matters for camera or laser topics.</dd>
    </dl>
    <h3>Status</h3>
    <p>Shows the receive rate (e.g. <code>9.8 Hz · turtlesim/Pose</code>).</p>
    <h3>Diagnosis</h3>
    <p>When nothing arrives for 5 s the node checks the topic list and tells the cases apart:</p>
    <ul>
        <li><b>topic not advertised</b> — nothing publishes this name; up to three similar
            names are suggested. Without a configured type the node waits and subscribes as soon as the
            topic appears.</li>
        <li><b>no data — check QoS / publisher</b> — the topic exists but nothing arrives. Typical cause:
            a <code>BEST_EFFORT</code> sensor publisher and a <code>RELIABLE</code> subscriber never
            match. The debug sidebar gets a longer explanation.</li>
    </ul>
</script>
