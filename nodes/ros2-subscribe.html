<script type="text/javascript">
RED.nodes.registerType('ros2-subscribe', {
    category: 'ROS 2',
    color: '#4b8bbe',
    defaults: {
        name: { value: '' },
        connection: { value: '', type: 'ros2-connection' },
        topic: { value: '', required: true },
        rosType: { value: '' },
        throttle: { value: 0, validate: RED.validators.number(true) },
        queue: { value: 1, validate: RED.validators.number(true) },
        qos: { value: 'auto' },
        qosReliability: { value: 'reliable' },
        qosDurability: { value: 'volatile' },
        qosDepth: { value: 10, validate: RED.validators.number(true) },
        compression: { value: 'none' },
        buffers: { value: false }
    },
    inputs: 0,
    outputs: 1,
    icon: 'feed.svg',
    paletteLabel: 'subscribe',
    label: function () {
        return this.name || this.topic || 'ros2 subscribe';
    },
    labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
    },
    outputLabels: ['message'],
    oneditprepare: function () {
        var $type = $('#node-input-rosType');
        var $hint = $('#ros2-subscribe-hint');
        ROS2Suite.attachAutocomplete($('#node-input-topic'), 'topics', ROS2Suite.connId,
            ROS2Suite.typeDetector($type, $hint, 'topic'), $hint);
        ROS2Suite.initOptions();
        // nodes saved before these options existed
        if (!$('#node-input-compression').val()) $('#node-input-compression').val('none');
        $('#node-input-compression').on('change', function () {
            $('.ros2-subscribe-json-only').toggle($(this).val() !== 'cbor');
        }).trigger('change');
    }
});
</script>

<script type="text/html" data-template-name="ros2-subscribe">
    <div class="form-row">
        <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
        <input type="text" id="node-input-connection">
    </div>
    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-rss"></i> Topic</label>
        <input type="text" id="node-input-topic" placeholder="/turtle1/pose" autocomplete="off">
        <span id="ros2-subscribe-hint" class="ros2-hint"></span>
    </div>
    <div class="form-row">
        <label for="node-input-rosType"><i class="fa fa-cube"></i> Type</label>
        <input type="text" id="node-input-rosType" placeholder="auto-detect">
    </div>
    <div class="form-row">
        <label for="node-input-throttle"><i class="fa fa-tachometer"></i> Throttle</label>
        <input type="text" id="node-input-throttle" style="width: 70px"> ms between messages (0 = every message)
    </div>
    <div class="form-row">
        <label for="node-input-queue"><i class="fa fa-list"></i> Queue</label>
        <input type="text" id="node-input-queue" style="width: 70px"> messages kept while throttling
    </div>
    <div class="form-row">
        <label for="node-input-qos"><i class="fa fa-sliders"></i> QoS</label>
        <select id="node-input-qos" style="width: 70%">
            <option value="auto">auto — rosbridge matches the publishers it sees</option>
            <option value="default">default — reliable, volatile, depth 10</option>
            <option value="sensor">sensor data — best effort, volatile, depth 5</option>
            <option value="latched">latched — reliable, transient local, depth 1</option>
            <option value="custom">custom</option>
        </select>
    </div>
    <div class="form-row ros2-qos-custom">
        <label for="node-input-qosReliability"></label>
        <select id="node-input-qosReliability" style="width: 26%">
            <option value="reliable">reliable</option>
            <option value="best_effort">best effort</option>
        </select>
        <select id="node-input-qosDurability" style="width: 28%">
            <option value="volatile">volatile</option>
            <option value="transient_local">transient local</option>
        </select>
        depth <input type="text" id="node-input-qosDepth" style="width: 50px">
    </div>
    <div class="form-row">
        <label for="node-input-compression"><i class="fa fa-compress"></i> Encoding</label>
        <select id="node-input-compression" style="width: 70%">
            <option value="none">JSON</option>
            <option value="cbor">CBOR — compact binary, for images, scans, point clouds</option>
        </select>
    </div>
    <div class="form-row ros2-subscribe-json-only">
        <input type="checkbox" id="node-input-buffers" style="display: inline-block; width: auto; vertical-align: top; margin-left: 105px;">
        <label for="node-input-buffers" style="width: auto;">deliver uint8[] fields as Buffer instead of base64</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/html" data-help-name="ros2-subscribe">
    <p>Receives messages from a ROS 2 topic through rosbridge.</p>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>the ROS message as JSON, e.g. <code>{x, y, theta, …}</code> for <code>turtlesim/msg/Pose</code>.</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd>the ROS topic name.</dd>
        <dt>ros <span class="property-type">object</span></dt>
        <dd><code>{topic, type, receivedAt}</code> — <code>receivedAt</code> is a millisecond timestamp.</dd>
    </dl>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Topic</dt>
        <dd>click into the field to pick from the topics the robot currently advertises.</dd>
        <dt>Type <span class="property-type">optional</span></dt>
        <dd>leave empty to detect it via rosapi. If set and the topic is advertised with a different
            type, the node reports the mismatch instead of subscribing.</dd>
        <dt>Throttle / Queue</dt>
        <dd>passed to rosbridge (<code>throttle_rate</code>, <code>queue_length</code>) — rosbridge drops
            messages before they cross the network, which matters for camera or laser topics. When several
            subscribe nodes share a topic, rosbridge sends at the fastest rate any of them asked for; the
            slower ones are throttled inside Node-RED.</dd>
        <dt>QoS</dt>
        <dd><b>auto</b> leaves the choice to rosbridge. The presets and <b>custom</b> set reliability,
            durability and depth explicitly — match them to the other side (<code>ros2 topic info -v</code>).
            rosbridge creates one ROS subscription per topic for all its clients, so the QoS of the first one
            wins until nobody uses the topic through rosbridge any more. Needs a rosbridge that understands
            the <code>qos</code> field (current releases for Humble and later); older ones ignore it.</dd>
        <dt>Encoding</dt>
        <dd><b>JSON</b> is the default; <code>uint8[]</code> fields (image data, …) arrive as base64
            strings, or as <code>Buffer</code> when the checkbox is ticked. <b>CBOR</b> makes rosbridge send
            compact binary frames: <code>uint8[]</code> fields arrive as <code>Buffer</code>, numeric arrays
            are not spelled out as text, and <code>NaN</code>/<code>Infinity</code> survive. Use it for
            images, laser scans and point clouds. The encoding applies to the topic on this connection: if
            one subscribe node asks for CBOR, all subscribe nodes of that topic receive Buffers.</dd>
    </dl>
    <p>64-bit integers (<code>int64</code>, <code>uint64</code>) become JavaScript numbers, which are exact
       only up to 2<sup>53</sup>.</p>
    <h3>Status</h3>
    <p>Shows the receive rate (e.g. <code>9.8 Hz · turtlesim/Pose</code>).</p>
    <h3>Diagnosis</h3>
    <p>When nothing arrives for 5 s the node checks the topic list, and keeps checking until data
       arrives. It tells the cases apart:</p>
    <ul>
        <li><b>topic not advertised</b> — nothing publishes this name; up to three similar
            names are suggested. Without a configured type the node waits and subscribes as soon as the
            topic appears.</li>
        <li><b>no data — check QoS / publisher</b> — the topic exists but nothing arrives. Causes: an idle
            publisher; QoS — rosbridge fixes its subscription QoS when the topic is first subscribed through
            it, and if all publishers were latched (<code>TRANSIENT_LOCAL</code>) then, it never receives
            <code>VOLATILE</code> or <code>BEST_EFFORT</code> publishers that join later (e.g. <code>/map</code>);
            or a data path that fails although discovery works (shared memory between containers, firewall,
            large messages over Wi-Fi). The debug sidebar gets the details once. If the publisher's QoS is
            the cause, set <i>QoS</i> on this node to match it.</li>
    </ul>
</script>
