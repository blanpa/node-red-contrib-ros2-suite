name: release

# Publishes to npm when a version tag is pushed:
#   npm version minor && git push --follow-tags
# Authentication is npm trusted publishing (OIDC): no token is stored here.
# On npmjs.com the package lists this repository and this workflow file
# (release.yml) as its trusted publisher.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # provenance is attached automatically with trusted publishing
      - run: npm publish --access public
